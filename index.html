<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>停车入库教练</title>
<!--
==========================================================================================
  停车入库教练 · 单文件 Three.js 教学网站（纯程序化建模，无外部模型/贴图/音频）

  【架构 / 数据流】
    关卡 LEVELS ──► World.build()  地面标线 LINES / 障碍 OBSTACLES / 目标库位 SLOT
                └─► buildIdeal()   标准路线（分段：直线 / 打满圆弧）→ PATH、关键姿态、打方向事件
                └─► makeSteps()    教学步骤（目标 / 判断依据 / 操作 / 原理 / 点位 / 判定）

    输入(键盘·触屏·鼠标) ─► 车辆物理(自行车模型, 后轴参考点, 自动挡位) car{x,z,θ,v,δ}
                                    │ 每帧
         ┌──────────────────────────┼──────────────────────┬───────────────────┐
         ▼                          ▼                      ▼                   ▼
   车辆模型同步               教学引擎(ctx 几何量)       评分(事件/指标)       历史(10Hz)
  轮子/方向盘/灯光       步骤判定·提示·幽灵车·预测轨迹   压线/碰撞/打方向时机    └► 回放/轨迹图
                          点位辅助(镜中/车内/地面)
         ▼                          ▼
   相机系统(4 视角)        后视镜(3×RenderTarget，UV 镜像，layer2 辅助线，2D 点位叠加)
         └────► 渲染：镜子 RT → 主画面 → 镜框叠加层 ──► UI(HUD/步骤卡/提示条/编辑器)

  坐标约定：1 unit = 1 m；地面 x-z 平面，y 向上。
    朝向 θ：前进方向 = (cosθ, sinθ)；车身右侧 = (-sinθ, cosθ)；δ>0 向右打方向；Three.js 中 rotation.y = -θ。
    车辆局部坐标：原点 = 后轴中心（地面），+x 向前，+z 向右（左舵车）。
==========================================================================================
-->
<style>
:root{
  --bg:#0e1116; --panel:rgba(14,18,26,.80); --panel-strong:rgba(14,18,26,.94);
  --border:rgba(255,255,255,.12); --text:#e9eef5; --muted:#9aa6b6;
  --accent:#3ddc84; --accent2:#5ad1ff; --warn:#ffb020; --danger:#ff5252; --rev:#ff9f1c;
  --radius:12px; --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none}
#app canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
button,select{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--border);background:rgba(255,255,255,.06);
  border-radius:8px;padding:6px 10px;white-space:nowrap;transition:background .15s,border-color .15s}
select{background:#1a2029}
button:hover{background:rgba(255,255,255,.12)}
button.on{background:rgba(61,220,132,.18);border-color:rgba(61,220,132,.6);color:#c8ffe0}
button.primary{background:var(--accent);color:#06210f;border-color:var(--accent);font-weight:600}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

#topbar{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:8px;align-items:center;padding:6px;overflow-x:auto;scrollbar-width:none;z-index:20}
#topbar::-webkit-scrollbar{display:none}
.seg{display:flex;gap:2px;background:rgba(0,0,0,.25);border-radius:9px;padding:2px;flex:none}
.seg button{border:none;background:transparent;padding:5px 10px}
.seg button.on{background:rgba(61,220,132,.22)}
.sep{width:1px;height:22px;background:var(--border);flex:none}
.brand{font-weight:700;padding:0 6px;flex:none}
.grow{flex:1}
kbd{font:11px/1 ui-monospace,Menlo,monospace;background:rgba(255,255,255,.12);border-radius:4px;padding:2px 4px;margin-left:4px;color:var(--muted)}

#hud{position:fixed;top:66px;left:12px;width:214px;padding:12px 14px;z-index:10}
#hud .speed{font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
#hud .speed small{font-size:13px;color:var(--muted);font-weight:400;margin-left:4px}
#hud .row{display:flex;justify-content:space-between;margin-top:6px;font-variant-numeric:tabular-nums}
#hud .row span:first-child{color:var(--muted)}
.gear{display:inline-block;min-width:28px;text-align:center;border-radius:6px;font-weight:700;padding:0 6px}
.gear.D{background:rgba(61,220,132,.2);color:var(--accent)}
.gear.R{background:rgba(255,159,28,.22);color:var(--rev)}
.hb-on{color:var(--danger);font-weight:700}
#hud .bar{height:6px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:4px;position:relative;overflow:hidden}
#hud .bar i{position:absolute;top:0;bottom:0;left:50%;background:var(--accent2);border-radius:3px}

#stepCard{position:fixed;top:66px;right:12px;width:350px;overflow:auto;padding:14px 16px;z-index:10}
#stepCard h3{margin:0 0 6px;font-size:16px}
#stepCard .stepno{color:var(--accent);font-size:12px;letter-spacing:1px}
.pills{display:flex;gap:4px;margin:6px 0 10px}
.pills i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.12)}
.pills i.done{background:var(--accent)} .pills i.cur{background:var(--accent2)}
.sec{margin-top:8px}
.sec b.lab{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:2px}
.sec.pt{padding:8px 10px;border-radius:8px;background:rgba(255,176,32,.08);border:1px solid rgba(255,176,32,.3)}
.sec.pt b.lab{color:var(--warn)}
.why{margin-top:10px;padding:8px 10px;border-radius:8px;background:rgba(90,209,255,.08);border:1px solid rgba(90,209,255,.25);font-size:13px}
.why b{color:var(--accent2)}
.done-box{margin-top:10px;padding:10px;border-radius:8px;background:rgba(61,220,132,.12);border:1px solid rgba(61,220,132,.45)}
.card-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#stepCard .toggle-detail{display:none}

#tip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + var(--safe-b));width:min(640px,calc(100vw - 420px));
  padding:10px 16px;font-size:15px;text-align:center;z-index:12}
#tip.warn{border-color:rgba(255,176,32,.7);background:rgba(60,40,5,.85)}
#tip.danger{border-color:rgba(255,82,82,.8);background:rgba(70,10,10,.88)}
#tip.ok{border-color:rgba(61,220,132,.7);background:rgba(5,45,22,.85)}

.mframe{position:fixed;border:3px solid #0b0d10;border-radius:14px;box-shadow:0 0 0 1px rgba(255,255,255,.18),0 6px 18px rgba(0,0,0,.45);pointer-events:none;z-index:8;display:none}
.mframe .lbl{position:absolute;left:8px;top:-22px;font-size:12px;color:#dfe7f1;text-shadow:0 1px 2px #000;white-space:nowrap}
.mframe .info{position:absolute;left:0;right:0;bottom:-22px;text-align:center;font-size:12px;color:#ffe14d;text-shadow:0 1px 2px #000;white-space:nowrap}
.mframe canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:11px}
.mframe.focus{border-color:var(--warn);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 1px rgba(255,255,255,.18),0 0 18px 4px rgba(255,176,32,.7)}}

#wheelUI{position:fixed;left:16px;bottom:calc(16px + var(--safe-b));width:136px;height:136px;z-index:11;touch-action:none;cursor:grab}
#wheelUI svg{width:100%;height:100%;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
#wheelUI .deg{position:absolute;left:0;right:0;bottom:-2px;text-align:center;font-size:12px;color:var(--muted)}
#wheelUI.glow svg{filter:drop-shadow(0 0 10px rgba(255,176,32,.9))}
#pedals{position:fixed;right:16px;bottom:calc(16px + var(--safe-b));display:grid;grid-template-columns:repeat(2,74px);gap:8px;z-index:11}
#pedals button{height:52px;font-weight:600;touch-action:none;border-radius:10px;background:var(--panel-strong)}
#pedals button.active{background:rgba(61,220,132,.35)}
#pedals .brk.active{background:rgba(255,82,82,.35)}
#pedals .hbbtn.on{color:#fff;background:rgba(255,82,82,.4);border-color:var(--danger)}
#pedals .glow{box-shadow:0 0 14px 3px rgba(255,176,32,.8)}

#editor{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + var(--safe-b));padding:10px 12px;z-index:25;display:none;max-width:calc(100vw - 16px)}
#editor .rrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#editor .hintline{font-size:12px;color:var(--muted);margin-top:6px}

.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,7,10,.55);z-index:40;padding:16px}
.modal.show{display:flex}
.modal .box{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px 24px;background:var(--panel-strong)}
.modal h2{margin:0 0 8px;font-size:20px}
.modal p{margin:6px 0;color:#cfd8e3}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0;font-size:13px}
.keys span:nth-child(odd){color:var(--accent2);white-space:nowrap}
.dots{display:flex;gap:6px;justify-content:center;margin-top:14px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.2)} .dots i.on{background:var(--accent)}
#results .box{width:min(860px,100%)}
.res-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;margin-top:8px}
.score{font-size:46px;font-weight:800;line-height:1}
.score.pass{color:var(--accent)} .score.fail{color:var(--danger)}
#mapCanvas{width:100%;border-radius:10px;background:#20242a;display:block}
.ded{font-size:13px;margin:4px 0;padding-left:0;list-style:none}
.ded li{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.08)}
.ded li em{font-style:normal;color:var(--danger);white-space:nowrap}
.advice{margin:6px 0 0;padding-left:18px} .advice li{margin:6px 0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:4px}
.lvl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:10px}
.lvl{text-align:left;white-space:normal;padding:10px 12px;line-height:1.4}
.lvl b{display:block;margin-bottom:2px} .lvl small{color:var(--muted)}
.lvl.on{border-color:var(--accent)}

#replayBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + var(--safe-b));width:min(720px,calc(100vw - 24px));padding:10px 14px;display:none;z-index:30}
#replayBar .rrow{display:flex;gap:8px;align-items:center}
#replayTrack{position:relative;flex:1;height:28px}
#replayTrack input{width:100%;margin:0;position:absolute;top:6px}
#replayTrack .mk{position:absolute;top:0;width:3px;height:10px;background:var(--danger);border-radius:1px;transform:translateX(-1px)}
#replayTime{font-variant-numeric:tabular-nums;color:var(--muted);min-width:84px;text-align:right}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9}

@media (max-width:760px){
  #hud{top:58px;left:8px;right:8px;width:auto;display:flex;gap:12px;align-items:center;padding:6px 10px;flex-wrap:wrap}
  #hud .speed{font-size:20px} #hud .row{margin:0;gap:4px} #hud .optional,#hud .bar{display:none}
  #stepCard{top:auto;bottom:calc(206px + var(--safe-b));left:8px;right:8px;width:auto;max-height:42vh;padding:10px 12px}
  #stepCard.collapsed .detail{display:none}
  #stepCard .toggle-detail{display:inline-block}
  #tip{width:calc(100vw - 16px);bottom:calc(152px + var(--safe-b));font-size:13px;padding:6px 10px}
  #wheelUI{width:128px;height:128px} #pedals{grid-template-columns:repeat(2,68px)}
  #editor{bottom:calc(200px + var(--safe-b))}
  .res-grid{grid-template-columns:1fr} kbd{display:none}
}
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="app"></div>

<div id="topbar" class="panel">
  <div class="brand">停车教练</div>
  <button id="btnLevel" title="选择场景 / 关卡">场景：<span id="lvlName">-</span> ▾</button>
  <div class="seg" id="modeSeg"><button data-mode="guide" class="on">引导</button><button data-mode="practice">练习</button></div>
  <div class="sep"></div>
  <div class="seg" id="viewSeg">
    <button data-view="0" class="on">跟随<kbd>1</kbd></button><button data-view="1">俯视<kbd>2</kbd></button>
    <button data-view="2">车内<kbd>3</kbd></button><button data-view="3">回头<kbd>4</kbd></button>
  </div>
  <div class="sep"></div>
  <button id="tPoint" class="on">点位辅助<kbd>P</kbd></button>
  <button id="tPip" class="on">镜子画中画<kbd>V</kbd></button>
  <button id="tHint" class="on">提示<kbd>H</kbd></button>
  <button id="tAux" class="on">镜中辅助线</button>
  <button id="tGhost" class="on">幽灵车</button>
  <button id="tPred" class="on">预测轨迹</button>
  <button id="tCenter">自动回正</button>
  <button id="btnEdit">摆放障碍</button>
  <div class="grow"></div>
  <button id="btnReset">重新开始</button>
  <button id="btnHelp">操作说明</button>
</div>

<div id="hud" class="panel">
  <div class="speed"><span id="hSpeed">0.0</span><small>km/h</small></div>
  <div class="row"><span>挡位·自动</span><span><span id="hGear" class="gear D">D</span> <span id="hHB"></span></span></div>
  <div class="row"><span>方向盘</span><span id="hWheel">0°</span></div>
  <div class="bar"><i id="hSteerBar"></i></div>
  <div class="row optional"><span>前轮转角</span><span id="hDelta">0.0°</span></div>
  <div class="row optional"><span>后轴转弯半径</span><span id="hRadius">直行</span></div>
  <div class="row"><span>用时</span><span id="hTime">0:00</span></div>
</div>

<div id="stepCard" class="panel"></div>
<div id="tip" class="panel">准备开始</div>

<div class="mframe" id="mfL"><canvas></canvas><div class="lbl">左后视镜</div><div class="info"></div></div>
<div class="mframe" id="mfR"><canvas></canvas><div class="lbl">右后视镜</div><div class="info"></div></div>
<div class="mframe" id="mfI"><canvas></canvas><div class="lbl">内后视镜</div><div class="info"></div></div>

<div id="wheelUI" title="拖动旋转方向盘（双击回正）">
  <svg viewBox="0 0 100 100">
    <g id="wheelRot">
      <circle cx="50" cy="50" r="44" fill="none" stroke="#2a2f37" stroke-width="10"/>
      <circle cx="50" cy="50" r="44" fill="none" stroke="#4a525e" stroke-width="2"/>
      <rect x="47" y="2" width="6" height="11" rx="2" fill="#ffb020"/>
      <path d="M8 52 L36 52 L42 62 L58 62 L64 52 L92 52" stroke="#2a2f37" stroke-width="8" fill="none" stroke-linejoin="round"/>
      <path d="M50 62 L50 93" stroke="#2a2f37" stroke-width="8"/>
      <circle cx="50" cy="52" r="12" fill="#1c2026" stroke="#4a525e" stroke-width="2"/>
    </g>
  </svg>
  <div class="deg" id="wheelDeg">0°</div>
</div>
<div id="pedals">
  <button class="fwd" id="bFwd">前进 ▲</button>
  <button class="hbbtn" id="bHB">手刹</button>
  <button class="rev" id="bRev">后退 ▼</button>
  <button class="brk" id="bBrake">刹车</button>
</div>

<div id="editor" class="panel">
  <div class="rrow">
    <b>摆放障碍</b>
    <div class="seg" id="edTools">
      <button data-t="cone" class="on">雪糕筒</button><button data-t="carH">障碍车(横)</button><button data-t="carV">障碍车(竖)</button><button data-t="del">删除</button>
    </div>
    <button id="edClear">清空自定义</button>
    <button class="primary" id="edDone">完成</button>
  </div>
  <div class="hintline">在地面上点击放置；自定义障碍按关卡自动保存在本机浏览器。车辆暂停，摆放后从起点重新开始。</div>
</div>

<div class="modal" id="onboard"><div class="box panel" id="onboardBox"></div></div>
<div class="modal" id="levels"><div class="box panel" id="levelsBox" style="width:min(760px,100%)"></div></div>
<div class="modal" id="results"><div class="box panel" id="resultsBox"></div></div>

<div id="replayBar" class="panel">
  <div class="rrow">
    <button id="rpPlay">暂停</button>
    <div class="seg" id="rpSpeed"><button data-s="0.25">0.25×</button><button data-s="0.5">0.5×</button><button data-s="1" class="on">1×</button></div>
    <div id="replayTrack"><input type="range" id="rpSlider" min="0" max="1" step="0.01" value="0"></div>
    <span id="replayTime">0.0s</span>
    <button id="rpClose">返回成绩</button>
  </div>
  <div style="font-size:12px;color:var(--muted);margin-top:4px">红色刻度 / 地面红圈 = 偏离标准路线较大的时刻（&gt; 0.35 m）</div>
</div>
<div id="fade"></div>

<script type="module">
import * as THREE from 'three';

/* =========================================================================================
   0. 常量配置（颜色 / 尺寸 / 物理 / 相机 / 后视镜 / 评分）
   ========================================================================================= */
const DEG = Math.PI / 180;

const COLORS = {
  sky: 0xb9d4ea, fog: 0xcadceb, asphalt: '#3a3d43',
  line: 0xf0f0f0, backLine: 0xe53935, controlLine: 0xf5c518,
  curb: 0xbab6ad, sidewalk: 0x8c8a85, grass: 0x557d3c, hedge: 0x2f5a2a,
  carBody: 0x2d7be0, parked: [0xd9dbde, 0xb3261e, 0x2b2b2e, 0x3f8f5a],
  glass: 0x1a2733, tire: 0x161616, rim: 0xc2c8cf, spoke: 0x6c737c, trim: 0x1f2226,
  interior: 0x2b2e33, seat: 0x3b3f47, headliner: 0x8d8f93, headlight: 0xfff3d0,
  tailDim: 0x5a0a0a, tailBrake: 0xff1a1a, tailReverse: 0xffffff,
  predRev: 0xff9f1c, predFwd: 0x3ddc84, corner: 0x7fd1ff, circle: 0xffffff,
  ghost: 0x5ad1ff, target: 0x3ddc84, highlight: 0xffb020, point: 0xffd54a,
  mirrorAux: 0xffe14d, mirrorSlot: 0x00e5ff, trail: 0xff5fa2, dev: 0xff3b30,
  cone: 0xff6a13,
};

const DIM = {                  // 倒车入库场地
  SLOT_W: 2.5, SLOT_L: 6.0, LINE_W: 0.10,
  SLOT_CENTERS: [-5, -2.5, 0, 2.5, 5],    // 一排 5 个库位，中间为目标库位
  LANE_Z: -3.3,                           // 标准路线：后轴 z（车身距库口 2.4 m）
  CURB_Z: -6, CONTROL_Z: -5.75,           // 路沿 / 控制线
};
const PDIM = {                 // 侧方停车场地（科目二：库长≈车长×1.5，此处放宽到 6.8 m；库宽 = 车宽 + 0.8 m）
  SL: 6.8, SW: 2.6,
  Z0: -1.45,                   // 标准路线后轴 z：车身右侧距库位外侧线 0.55 m
  STOP_X: 7.0,                 // 定点：后轴 x（右后轮越过库前线 0.2 m）
  EDGE_Z: -3.85, CURB_Z: -4.1, // 对向道路边线（黄线）/ 路沿
  RCURB_Z: 2.75,               // 库位右侧路沿
};

const CAR = {
  LEN: 4.3, WIDTH: 1.8, HEIGHT: 1.45, WHEELBASE: 2.6,
  REAR_OH: 0.8, FRONT_OH: 0.9, HALF_W: 0.9, TRACK: 1.56, WHEEL_R: 0.32, WHEEL_W: 0.21,
  HEAD: { x: 1.02, y: 1.17, z: -0.37 },       // 驾驶员眼点（左舵）
  REAR_HEAD: { x: 1.10, y: 1.16, z: -0.22 },  // 回头看时头部位置
  HOOD_X: 2.4, HOOD_Y: 0.95,                  // 车内点位所在的发动机盖截面
};
CAR.FRONT = CAR.WHEELBASE + CAR.FRONT_OH;     // 3.5

function carCorners(st) {
  return [carToWorld(st, CAR.BACK, -CAR.HALF_W), carToWorld(st, CAR.FRONT, -CAR.HALF_W), carToWorld(st, CAR.FRONT, CAR.HALF_W), carToWorld(st, CAR.BACK, CAR.HALF_W)];
}
/** 车身矩形上离点最近的点（世界坐标）与距离 */
function nearestOnCar(st, x, z) {
  const p = worldToCar(st, x, z);
  const q = { x: clamp(p.x, CAR.BACK, CAR.FRONT), z: clamp(p.z, -CAR.HALF_W, CAR.HALF_W) };
  return { d: Math.hypot(p.x - q.x, p.z - q.z), w: carToWorld(st, q.x, q.z) };
}
function polysOverlap(A, B) {
  for (const P of [A, B]) for (let i = 0; i < P.length; i++) {
    const p1 = P[i], p2 = P[(i + 1) % P.length], nx = p2.z - p1.z, nz = -(p2.x - p1.x);
    let a0 = Infinity, a1 = -Infinity, b0 = Infinity, b1 = -Infinity;
    for (const q of A) { const d = q.x * nx + q.z * nz; a0 = Math.min(a0, d); a1 = Math.max(a1, d); }
    for (const q of B) { const d = q.x * nx + q.z * nz; b0 = Math.min(b0, d); b1 = Math.max(b1, d); }
    if (a1 < b0 || b1 < a0) return false;
  }

}

function lineDist(p, a, b) { const dx = b[0] - a[0], dz = b[1] - a[1], L = Math.hypot(dx, dz); return ((p.x - a[0]) * -dz + (p.z - a[1]) * dx) / L * -1; }

  const inner = Math.atan(CAR.WHEELBASE / (R - CAR.TRACK / 2)), outer = Math.atan(CAR.WHEELBASE / (R + CAR.TRACK / 2));

}

const WHEELS_LOCAL = [{ name: '左前轮', x: CAR.WHEELBASE, z: -CAR.TRACK / 2 }, { name: '右前轮', x: CAR.WHEELBASE, z: CAR.TRACK / 2 }, { name: '左后轮', x: 0, z: -CAR.TRACK / 2 }, { name: '右后轮', x: 0, z: CAR.TRACK / 2 }];

      for (const off of [-0.25, 0, 0.25]) { const p = carToWorld(car, w.x + off, w.z); if (p.x > L.x0 - tw && p.x < L.x1 + tw && p.z > L.z0 - tw && p.z < L.z1 + tw) { touch = true; break; } }

  /** 记录实际的打方向事件，按顺序匹配标准路线中的事件 */
  trackSteer() {
    const m = S.metrics, lim = PHYS.MAX_STEER;
    const st = car.d > 0.85 * lim ? 'R' : car.d < -0.85 * lim ? 'L' : Math.abs(car.d) < 0.25 * lim ? 'C' : this.steerState;

    if (!kind) return;
    const exp = IDEAL.events[m.evPtr];
    if (!exp || exp.kind !== kind || (kind === 'lock' && exp.steer !== steer)) return;
    if (Math.hypot(car.x - exp.pose.x, car.z - exp.pose.z) > 3.5) return;
    m.evActual[m.evPtr] = { x: car.x, z: car.z, th: car.th, t: S.time };
    m.evPtr++;

  track() {
    const m = S.metrics, moving = Math.abs(car.v) > 0.05 ? Math.sign(car.v) : 0;
    if (moving !== 0) { if (m.revStarted && m.lastDir !== 0 && moving !== m.lastDir) m.corrections++; m.lastDir = moving; }   // 首次 前进→倒车 不计修正
    if (moving < 0) m.revStarted = true;

    if (m.revStarted) { m.minCorner = Math.min(m.minCorner, ctx.cornerDist); m.maxDev = Math.max(m.maxDev, ctx.dev); }
  },
  final() {
    const ded = S.events.map((e) => ({ text: e.text, pts: e.pts, fatal: e.fatal }));
    const c = computeCtx(car);
    if (!c.inSlot) ded.push({ text: '车身未完全进入库位（入库失败 / 车身出线）', pts: SCORE.FATAL, fatal: true });
    const lat = Math.abs(c.lateral);
    if (lat > SCORE.LAT_BAD) ded.push({ text: `车身偏离库位中线 ${fmt(lat)} m`, pts: SCORE.LAT_BAD_PTS });
    else if (lat > SCORE.LAT_WARN) ded.push({ text: `车身偏离库位中线 ${fmt(lat)} m`, pts: SCORE.LAT_WARN_PTS });
    const ang = Math.abs(c.thErr);
    if (ang > SCORE.ANG_BAD) ded.push({ text: `车身与库位线夹角 ${fmt(ang, 1)}°`, pts: SCORE.ANG_BAD_PTS });
    else if (ang > SCORE.ANG_WARN) ded.push({ text: `车身与库位线夹角 ${fmt(ang, 1)}°`, pts: SCORE.ANG_WARN_PTS });
    if (SLOT.gapRule === 'rear' && c.inSlot && (c.rearGap < SCORE.GAP_MIN || c.rearGap > SCORE.GAP_MAX)) ded.push({ text: `车尾距库底线 ${fmt(c.rearGap)} m（理想 ${SCORE.GAP_MIN}–${SCORE.GAP_MAX} m）`, pts: SCORE.GAP_PTS });
    const extra = S.metrics.corrections - SCORE.MAX_CORRECTIONS;
    if (extra > 0) ded.push({ text: `前后换向修正 ${S.metrics.corrections} 次（允许 ${SCORE.MAX_CORRECTIONS} 次）`, pts: extra * SCORE.CORRECTION });
    if (S.mode === 'practice' && S.time > SCORE.TIME_LIMIT) ded.push({ text: `超时（${fmt(S.time, 0)} s > ${SCORE.TIME_LIMIT} s）`, pts: SCORE.FATAL, fatal: true });

  },
  /** 针对性建议：比较每一次打方向的实际位置/角度与标准路线 */
  advice(c) {
    const m = S.metrics, list = [], texts = adviceTexts();
    IDEAL.events.forEach((e, i) => {
      const a = m.evActual[i], T = texts[i];
      if (!a) { if (i === m.evPtr) list.push([1.5, `没有检测到"${T.name}"（第 ${i + 1} 次打方向）。按标准顺序：${IDEAL.events.map((x, j) => texts[j].name).join(' → ')}。`]); return; }
      if (e.kind === 'center') {

        if (Math.abs(err) > SCORE.EV_ANGLE) list.push([Math.abs(err) / 5, `${T.name}${err > 0 ? '偏晚' : '偏早'} ${fmt(Math.abs(err), 0)}°：${err > 0 ? T.late : T.early}`]);
      } else {
        const tx = Math.cos(e.pose.th) * e.segDir, tz = Math.sin(e.pose.th) * e.segDir;
        const err = (a.x - e.pose.x) * tx + (a.z - e.pose.z) * tz;   // >0 = 沿接下来的运动方向多走了 = 打晚了
        if (Math.abs(err) > SCORE.EV_ALONG) list.push([Math.abs(err) * 2, `${T.name}${err > 0 ? '偏晚' : '偏早'} ${fmt(Math.abs(err))} m：${err > 0 ? T.late : T.early}`]);
      }
    });
    // 压线 / 出线时解释原因：最终横向偏向哪一侧，对应哪一把方向
    const lineHit = S.events.find((e) => e.key.startsWith('line:'));
    if ((lineHit || !c.inSlot) && Math.abs(c.lateral) > 0.12) {
      const side = c.lateral > 0 ? '右' : '左';
      let cause;
      if (LEVEL.type === 'garage') {
        const inner = c.lateral * LEVEL.side > 0;
        cause = inner ? `偏向库角一侧，多半是向${sideName(LEVEL.side)}打满偏早（第 1 步停过了定点）` : `偏向外侧，多半是向${sideName(LEVEL.side)}打满偏晚（没到定点就打，或倒车后才打方向）`;
      } else cause = c.lateral > 0 ? '偏向路沿，多半是向左打满偏晚' : '离路沿太远，多半是向左打满偏早';
      list.push([2.5, `${lineHit ? lineHit.text + '：' : ''}车身最终偏${side} ${fmt(Math.abs(c.lateral))} m、夹角 ${fmt(Math.abs(c.thErr), 1)}°，${cause}。库位两侧余量只有约 0.3 m，定点每差 10 cm，入库后就横向偏约 10 cm。`]);
    }
    if (m.minCorner < 0.2) list.push([1.6, `车身距${SLOT.keyName}最近仅 ${fmt(m.minCorner)} m，非常危险。打方向时一定要盯住对应的后视镜。`]);
    if (SLOT.gapRule === 'rear' && c.inSlot && c.rearGap > SCORE.GAP_MAX) list.push([c.rearGap, `停车偏早，车尾距库底线还有 ${fmt(c.rearGap)} m。看镜中后轮与库底线的点位（约 1.2 m）。`]);
    if (c.rearGap < SCORE.GAP_MIN) list.push([2, `倒得太深（车尾余量 ${fmt(c.rearGap)} m），提前减速。`]);
    if (m.corrections > SCORE.MAX_CORRECTIONS) list.push([m.corrections, `本次前后换向修正 ${m.corrections} 次。修正多通常是第 1 步定点不准导致的，先把定点练准。`]);
    if (Math.abs(c.lateral) > SCORE.LAT_WARN && !list.length) list.push([1, `车身最终偏${c.lateral > 0 ? '右' : '左'} ${fmt(Math.abs(c.lateral))} m，回到第 1 步检查定点与横向距离点位。`]);
    list.sort((a, b) => b[0] - a[0]);
    const out = list.slice(0, 3).map((x) => x[1]);
    if (!out.length) out.push(`路线与标准路线高度吻合（最大偏差 ${fmt(m.maxDev)} m）。试试关闭点位辅助（P）或切到车内视角只看后视镜完成。`);
    if (out.length < 2) out.push('小技巧：倒车全程保持 1–2 km/h（点按 S），速度越慢，判断与修正的时间越充裕。');
    return out;
  },
};
function adviceTexts() {
  if (LEVEL.type === 'garage') {
    const inn = sideName(LEVEL.side), out = sideName(-LEVEL.side);
    return [
      { name: `向${inn}打满`, early: `第 1 步停车过了定点 / 打方向偏早，圆弧终点偏向库位${inn}侧，车身最终偏${inn}。下次在${inn}后轮与第二条线对齐时就停。`,
        late: `打满的位置偏后（停车没到定点，或倒车后才打方向），圆弧整体偏向${out}侧。应停在定点、原地打满再倒。` },
      { name: '回正', early: `车身还没平行就回了方向，车身斜着进库。看${out}镜：黄色延长线与库线平行再回。`, late: '车身已转过头才回正。回正需要时间，在"快平行"（约差 5°）时就开始回。' },
    ];
  }
  return [
    { name: '向右打满', early: '停车点偏前（右后轮过库前线太多），S 形整体前移，车头容易刮库前角/前车。', late: '停车点偏后，S 形整体后移，车尾容易压库后线/碰后车。' },
    { name: '45° 回正', early: '车身角度不够就回正，横移不足，最后离右边线太远。', late: '转过 45° 才回正，车尾容易切到右侧边线/路沿。' },
    { name: '向左打满', early: '左打满太早，车身横移不够，最终离右边线远、车头露出。', late: '左打满太晚，车尾会压右边线甚至碰路沿。看左镜：车尾左角压虚线就打。' },
    { name: '最终回正', early: '车身还没平行就回正，车头朝外斜着。', late: '车身摆正后还在打方向，车头会向右扎。' },
  ];
}

    S.metrics = { corrections: 0, lastDir: 0, revStarted: false, minCorner: Infinity, maxDev: 0, evPtr: 0, evActual: [] };
    Score.contacts.clear(); Score.steerState = 'C'; trailClear(); Replay.stop(true);

const devGroup = new THREE.Group(); scene.add(devGroup);
const Replay = {
  active: false, playing: true, t: 0, speed: 1, state: { x: 0, z: 0, th: 0, d: 0, v: 0, gear: 'D', hb: false }, marks: [],
  computeMarks() {
    const marks = []; let cur = null;
    for (const p of S.history) { if (p.dev > SCORE.DEV_MARK) { if (!cur || p.dev > cur.dev) cur = p; } else if (cur) { marks.push(cur); cur = null; } }
    if (cur) marks.push(cur); return marks;
  },
  start() {
    if (S.history.length < 2) { Tip.flash('没有可回放的轨迹。', 'warn'); return; }
    this.active = true; this.playing = true; this.t = 0; this.marks = this.computeMarks();
    devGroup.children.slice().forEach((c) => { disposeTree(c); devGroup.remove(c); });
    const mat = new THREE.MeshBasicMaterial({ color: COLORS.dev, transparent: true, opacity: 0.85, depthWrite: false });
    for (const m of this.marks) { const r = new THREE.Mesh(new THREE.RingGeometry(0.25, 0.4, 24), mat); r.rotation.x = -Math.PI / 2; r.position.set(m.x, 0.04, m.z); devGroup.add(r); }
    devGroup.visible = true;
    const dur = S.history[S.history.length - 1].t; $('rpSlider').max = dur;
    const track = $('replayTrack'); track.querySelectorAll('.mk').forEach((e) => e.remove());
    for (const m of this.marks) { const d = document.createElement('div'); d.className = 'mk'; d.style.left = (m.t / dur) * 100 + '%'; track.appendChild(d); }
    $('results').classList.remove('show'); $('replayBar').style.display = 'block'; $('tip').style.display = 'none'; $('stepCard').style.display = 'none';
    $('rpPlay').textContent = '暂停'; CamSys.setView(VIEW.TOP);
  },
  stop(silent) {
    if (!this.active) return;
    this.active = false; devGroup.visible = false; $('replayBar').style.display = 'none'; $('tip').style.display = ''; UI.renderStepCard();
    if (!silent && S.result) $('results').classList.add('show');
  },
  update(dt) {
    const h = S.history; if (!h.length) return;
    const dur = h[h.length - 1].t;
    if (this.playing) { this.t += dt * this.speed; if (this.t >= dur) { this.t = dur; this.playing = false; $('rpPlay').textContent = '播放'; } }
    this.t = clamp(this.t, h[0].t, dur);
    let i = h.findIndex((p) => p.t >= this.t); if (i <= 0) i = 1;
    const a = h[i - 1], b = h[i], f = b.k !== a.k ? 1 : clamp((this.t - a.t) / Math.max(1e-6, b.t - a.t), 0, 1);
    Object.assign(this.state, { x: lerp(a.x, b.x, f), z: lerp(a.z, b.z, f), th: lerpAngle(a.th, b.th, f), d: lerp(a.d, b.d, f), v: lerp(a.v, b.v, f), gear: b.g, hb: false });
    $('rpSlider').value = this.t; $('replayTime').textContent = `${fmt(this.t, 1)} / ${fmt(dur, 1)} s`;
    const near = this.marks.find((m) => Math.abs(m.t - this.t) < 0.5);
    if (near) Tip.set(`此刻偏离标准路线 ${fmt(near.dev)} m（第 ${near.step + 1} 步：${STEPS[near.step].title}）`, 'warn');
  },
};

const Editor = {
  tool: 'cone', raycaster: new THREE.Raycaster(), plane: new THREE.Plane(new THREE.Vector3(0, 1, 0), 0),
  items(id) { return LS.get('rp_custom_' + id, []).map((o) => ({ ...o, custom: true })); },
  save(list) { LS.set('rp_custom_' + LEVEL.id, list.map(({ custom, ...o }) => o)); },
  open() {
    if (Replay.active) Replay.stop(true);
    S.editing = true; S.paused = true; $('editor').style.display = 'block'; $('btnEdit').classList.add('on');
    Physics.setPose(IDEAL.start); CamSys.setView(VIEW.TOP);
    Tip.set('摆放模式：在地面上点击放置，选"删除"后点击已放的障碍可删除。', 'info');
  },
  close() {

    S.editing = false; $('editor').style.display = 'none'; $('btnEdit').classList.remove('on');
    Session.reset(); CamSys.setView(VIEW.CHASE);
  },
  click(cx, cy) {
    const ndc = new THREE.Vector2((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1);
    this.raycaster.setFromCamera(ndc, camera);
    const hit = new THREE.Vector3(); if (!this.raycaster.ray.intersectPlane(this.plane, hit)) return;
    const list = this.items(LEVEL.id);
    if (this.tool === 'del') {
      let bi = -1, bd = 2.5;
      list.forEach((o, i) => { const c = o.kind === 'car' ? carToWorld(o, 1.35, 0) : o; const d = Math.hypot(c.x - hit.x, c.z - hit.z); if (d < bd) { bd = d; bi = i; } });
      if (bi < 0) { Tip.flash('附近没有自定义障碍（预设障碍不能删除）。', 'warn'); return; }
      list.splice(bi, 1);
    } else if (this.tool === 'cone') list.push({ kind: 'cone', x: +hit.x.toFixed(2), z: +hit.z.toFixed(2) });
    else {
      const th = this.tool === 'carH' ? 0 : -Math.PI / 2, o = { kind: 'car', th, color: (list.length + 1) % COLORS.parked.length };
      const c = carToWorld({ x: 0, z: 0, th }, 1.35, 0); o.x = +(hit.x - c.x).toFixed(2); o.z = +(hit.z - c.z).toFixed(2);   // 点击处 = 车身中心
      list.push(o);
    }
    this.save(list); World.build(LEVEL);
    if (collides(car)) { list.pop(); this.save(list); World.build(LEVEL); Tip.flash('不能放在起点车辆上。', 'warn'); }
  },
  clear() { this.save([]); World.build(LEVEL); Tip.flash('已清空本关自定义障碍。', 'info'); },
};

};

const UI = {
  wheelDragging: false, _last: {},
  init() {
    $('modeSeg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) Session.setMode(b.dataset.mode); });
    $('viewSeg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) CamSys.setView(+b.dataset.view); });
    const tog = (id, key, after) => $(id).addEventListener('click', () => { S[key] = !S[key]; UI.syncToggles(); after && after(); });
    tog('tPip', 'pip'); tog('tHint', 'hints', () => UI.renderStepCard()); tog('tAux', 'aux'); tog('tGhost', 'ghost'); tog('tPred', 'pred'); tog('tCenter', 'autoCenter'); tog('tPoint', 'points', () => UI.renderStepCard());

    $('edClear').addEventListener('click', () => Editor.clear());

    document.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) b.blur(); });   // 防止空格/回车再次触发按钮

    const hold = (el, on) => {
      const set = (v) => (e) => { e.preventDefault(); on(v); el.classList.toggle('active', v); };
      el.addEventListener('pointerdown', set(true)); ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => el.addEventListener(ev, set(false)));
    };
    hold($('bFwd'), (v) => (input.touchFwd = v)); hold($('bRev'), (v) => (input.touchRev = v)); hold($('bBrake'), (v) => (input.touchBrake = v));
    $('bHB').addEventListener('click', () => Physics.toggleHB());

    const capture = (el, e) => { try { el.setPointerCapture(e.pointerId); } catch (err) { /* 指针已失效 */ } };
    // 虚拟方向盘：拖动累积角度（可超过 360°）
    const wheel = $('wheelUI'); let prevA = 0, acc = 0;
    const ang = (e) => { const r = wheel.getBoundingClientRect(); return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)); };
    wheel.addEventListener('pointerdown', (e) => { capture(wheel, e); this.wheelDragging = true; prevA = ang(e); acc = (car.d / DEG) * PHYS.STEER_RATIO; });
    wheel.addEventListener('pointermove', (e) => {
      if (!this.wheelDragging) return;
      const a = ang(e); acc += wrapAngle(a - prevA) / DEG; prevA = a;
      const lim = (PHYS.MAX_STEER / DEG) * PHYS.STEER_RATIO; acc = clamp(acc, -lim, lim); car.steerTarget = (acc / PHYS.STEER_RATIO) * DEG;
    });
    const endWheel = () => { this.wheelDragging = false; };
    wheel.addEventListener('pointerup', endWheel); wheel.addEventListener('pointercancel', endWheel);
    wheel.addEventListener('dblclick', () => (car.steerTarget = 0));

    // 画布：拖动环绕/转头，滚轮与双指缩放；摆放模式下点击放置
    const cv = renderer.domElement, ptrs = new Map(); let pinch = 0, downAt = null;
    cv.addEventListener('pointerdown', (e) => { capture(cv, e); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); downAt = { x: e.clientX, y: e.clientY }; });
    cv.addEventListener('pointermove', (e) => {
      const p = ptrs.get(e.pointerId); if (!p) return;
      if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; const d0 = Math.hypot(a.x - b.x, a.y - b.y); p.x = e.clientX; p.y = e.clientY; const d1 = Math.hypot(a.x - b.x, a.y - b.y); if (pinch && d0 > 0) CamSys.zoom(d0 / d1); pinch = d1; return; }
      CamSys.drag(e.clientX - p.x, e.clientY - p.y); p.x = e.clientX; p.y = e.clientY;
    });
    const up = (e) => {
      if (S.editing && downAt && ptrs.size === 1 && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) < 6) Editor.click(e.clientX, e.clientY);
      ptrs.delete(e.pointerId); pinch = 0; downAt = null;
    };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', (e) => { ptrs.delete(e.pointerId); downAt = null; });
    cv.addEventListener('wheel', (e) => { e.preventDefault(); CamSys.zoom(1 + clamp(e.deltaY, -100, 100) * 0.0012); }, { passive: false });
    cv.addEventListener('dblclick', () => CamSys.resetOffsets());

    const NAV = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Enter'];
    addEventListener('keydown', (e) => {
      if (NAV.includes(e.code)) e.preventDefault();
      input.keys.add(e.code);
      if (e.repeat) return;
      switch (e.code) {

        case 'KeyP': S.points = !S.points; UI.syncToggles(); UI.renderStepCard(); break;
        case 'KeyC': car.steerTarget = 0; break;

        case 'Escape': Onboard.close(); $('levels').classList.remove('show'); Editor.close(); break;
      }
    });
    addEventListener('keyup', (e) => input.keys.delete(e.code));
    addEventListener('blur', () => input.keys.clear());

    $('rpPlay').addEventListener('click', () => { if (!Replay.playing && Replay.t >= S.history[S.history.length - 1].t) Replay.t = 0; Replay.playing = !Replay.playing; $('rpPlay').textContent = Replay.playing ? '暂停' : '播放'; });
    $('rpSpeed').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; Replay.speed = +b.dataset.s; [...$('rpSpeed').children].forEach((c) => c.classList.toggle('on', c === b)); });
    $('rpSlider').addEventListener('input', (e) => { Replay.t = +e.target.value; Replay.playing = false; $('rpPlay').textContent = '播放'; });
    $('rpClose').addEventListener('click', () => Replay.stop());
    this.syncToggles();
  },
  syncToggles() {

      <div class="card-actions" style="justify-content:flex-end"><button id="lvClose">关闭</button></div>`;
    $('levels').classList.add('show');
    box.querySelectorAll('.lvl').forEach((b) => (b.onclick = () => { $('levels').classList.remove('show'); Editor.close(); Session.loadLevel(b.dataset.id); }));
    $('lvClose').onclick = () => $('levels').classList.remove('show');
  },
  renderStepCard() {
    const el = $('stepCard');
    el.style.display = (S.hints || Teach.waiting || S.mode === 'practice') && !Replay.active ? '' : 'none';
    if (S.mode === 'practice') {
      const st = Teach.step;
      el.innerHTML = `<div class="stepno">练习模式 · ${LEVEL.name}</div><h3>独立完成</h3>
        <div class="sec">无引导，只在出错时提示。完成条件：车身完全入库、停稳，按 空格 拉手刹交卷。</div>
        ${S.points && st.point ? `<div class="sec pt"><b class="lab">📍 当前阶段点位（P 键关闭）</b>${st.cue}</div>` : ''}
        <div class="sec"><b class="lab">判定（参考科目二）</b>压线 / 碰撞 / 车身出线 / 超时 ${SCORE.TIME_LIMIT}s → 不合格；修正超过 ${SCORE.MAX_CORRECTIONS} 次、停车偏差 → 扣分；≥ ${SCORE.PASS} 分合格。</div>
        <div class="card-actions"><button id="btnSubmit">交卷评分</button></div>`;
      $('btnSubmit').addEventListener('click', () => { if (!S.finished) Session.finish(); });
      return;
    }
    const i = Teach.stepIdx, st = STEPS[i];
    const pills = STEPS.map((_, k) => `<i class="${k < i || (k === i && Teach.waiting) ? 'done' : k === i ? 'cur' : ''}"></i>`).join('');
    el.innerHTML = `<div class="stepno">引导 · ${LEVEL.name} · 第 ${i + 1} / ${STEPS.length} 步 <button class="toggle-detail" id="tgDetail" style="padding:0 6px;margin-left:6px;font-size:12px">详情</button></div>
      <h3>${st.title}</h3><div class="pills">${pills}</div>
      ${Teach.waiting ? `<div class="done-box"><b>✓ 达成</b><div>${st.doneText}</div></div>
        <div class="card-actions"><button class="primary" id="btnNext">${i === STEPS.length - 1 ? '查看成绩' : '继续 ▶'}</button><button id="btnRedo">重做本步</button></div>` : ''}
      <div class="detail">
        <div class="sec"><b class="lab">🎯 目标位置</b>${st.goal}</div>
        <div class="sec ${S.points ? 'pt' : ''}"><b class="lab">📍 判断依据 / 点位${S.points ? '' : '（点位辅助已关闭）'}</b>${st.cue}</div>
        <div class="sec"><b class="lab">🕹 操作指令</b>${st.action}</div>
        <div class="why"><b>为什么？</b> ${st.why}</div>
        ${Teach.waiting ? '' : '<div class="card-actions"><button id="btnRedo">重做本步</button></div>'}
      </div>`;
    if (IS_TOUCH && innerWidth < 760 && !Teach.waiting) el.classList.add('collapsed'); else el.classList.remove('collapsed');
    $('btnNext') && $('btnNext').addEventListener('click', () => Teach.next());
    $('btnRedo') && $('btnRedo').addEventListener('click', () => Teach.redo());
    $('tgDetail') && $('tgDetail').addEventListener('click', () => el.classList.toggle('collapsed'));
  },
  hud() {
    const st = vis(), set = (id, v) => { if (this._last[id] !== v) { this._last[id] = v; $(id).textContent = v; } };
    set('hSpeed', fmt(Math.abs(st.v) * 3.6, 1));
    const g = $('hGear'); if (g.textContent !== st.gear) { g.textContent = st.gear; g.className = 'gear ' + st.gear; }
    set('hHB', st.hb ? '手刹 P' : ''); $('hHB').className = st.hb ? 'hb-on' : '';
    const wheelDeg = (st.d / DEG) * PHYS.STEER_RATIO;
    set('hWheel', `${wheelDeg > 0.5 ? '右 ' : wheelDeg < -0.5 ? '左 ' : ''}${fmt(Math.abs(wheelDeg), 0)}°`);
    set('hDelta', fmt(st.d / DEG, 1) + '°');
    set('hRadius', Math.abs(st.d) > 0.5 * DEG ? fmt(CAR.WHEELBASE / Math.tan(Math.abs(st.d)), 2) + ' m' : '直行');
    const tt = Replay.active ? Replay.t : S.time; set('hTime', `${Math.floor(tt / 60)}:${String(Math.floor(tt % 60)).padStart(2, '0')}`);
    const bar = $('hSteerBar'), pct = (st.d / PHYS.MAX_STEER) * 50; bar.style.left = (pct < 0 ? 50 + pct : 50) + '%'; bar.style.width = Math.abs(pct) + '%';
    $('wheelRot').setAttribute('transform', `rotate(${wheelDeg} 50 50)`);   // 屏幕方向盘与车内方向盘同步
    set('wheelDeg', `${fmt(wheelDeg, 0)}°`);
    $('bHB').classList.toggle('on', st.hb);
    const info = (k, txt) => { const e = $('mf' + k).querySelector('.info'); if (e.textContent !== txt) e.textContent = txt; };
    const showInfo = S.aux && ctx.nearSlot;
    info('L', showInfo ? `左侧距库线 ${fmt(ctx.leftGap)} m` : '');
    info('R', showInfo ? `右侧距库线 ${fmt(ctx.rightGap)} m` : '');
    info('I', showInfo ? `车尾余量 ${fmt(ctx.rearGap)} m` : '');
  },
  showResults(r) {
    const box = $('resultsBox');
    box.innerHTML = `
      <div style="color:var(--muted);font-size:12px">${LEVEL.name} · ${S.mode === 'guide' ? '引导模式' : '练习模式'} · 用时 ${fmt(S.time, 1)} s${S.usedRedo ? ' · 使用过"重做本步"' : ''}</div>
      <div class="score ${r.pass ? 'pass' : 'fail'}">${r.score}<span style="font-size:18px;margin-left:8px">${r.pass ? '合格' : '不合格'}</span></div>
      <div class="res-grid">
        <div><canvas id="mapCanvas" width="840" height="600"></canvas>
          <div class="legend"><span><i style="background:#3ddc84"></i>标准路线</span><span><i style="background:#ff5fa2"></i>你的后轴轨迹</span><span><i style="background:#ffd54a;height:8px;width:8px;border-radius:50%"></i>你的打方向点</span><span><i style="background:#ff3b30;height:8px;width:8px;border-radius:50%"></i>偏差大</span><span><i style="background:#5ad1ff"></i>最终车身</span></div></div>
        <div><b>判定明细</b>
          <ul class="ded">${r.ded.length ? r.ded.map((d) => `<li><span>${d.text}</span><em>${d.fatal ? '不合格' : '−' + d.pts}</em></li>`).join('') : '<li><span>无扣分项</span><em style="color:var(--accent)">满分</em></li>'}</ul>
          <div style="font-size:12px;color:var(--muted)">停车：偏中线 ${fmt(Math.abs(r.ctx.lateral))} m · 夹角 ${fmt(Math.abs(r.ctx.thErr), 1)}° · 前/后余量 ${fmt(r.ctx.frontGap)} / ${fmt(r.ctx.rearGap)} m · 修正 ${S.metrics.corrections} 次</div>
          <div style="margin-top:12px"><b>改进建议</b><ol class="advice">${r.advice.map((a) => `<li>${a}</li>`).join('')}</ol></div>
        </div>
      </div>
      <div class="card-actions" style="margin-top:14px">
        <button class="primary" id="rsAgain">再练一次</button><button id="rsReplay">回放（含慢动作）</button>
        <button id="rsMode">${S.mode === 'guide' ? '试试练习模式' : '回到引导模式'}</button><button id="rsLevel">换个场景</button>
      </div>`;
    $('results').classList.add('show');
    drawTrackMap($('mapCanvas'));
    $('rsAgain').onclick = () => Session.reset();
    $('rsReplay').onclick = () => Replay.start();
    $('rsMode').onclick = () => Session.setMode(S.mode === 'guide' ? 'practice' : 'guide');
    $('rsLevel').onclick = () => { $('results').classList.remove('show'); UI.showLevels(); };
  },
};

function drawTrackMap(cv) {
  const g = cv.getContext('2d'), W = cv.width, H = cv.height;
  const xs = PATH.map((p) => p.x), zs = PATH.map((p) => p.z);
  let X0 = Math.min(...xs) - 3, X1 = Math.max(...xs) + 5, Z0 = Math.min(...zs, SLOT.cz - SLOT.hw) - 3, Z1 = Math.max(...zs, SLOT.cz + 4) + 1.5;
  const sc = Math.min(W / (X1 - X0), H / (Z1 - Z0)), ox = (W - (X1 - X0) * sc) / 2, oz = (H - (Z1 - Z0) * sc) / 2;
  const P = (x, z) => [ox + (x - X0) * sc, oz + (z - Z0) * sc];
  g.fillStyle = '#2b2f35'; g.fillRect(0, 0, W, H);
  const rect = (r, fill) => { const [a, b] = P(r.x0, r.z0), [c, d] = P(r.x1, r.z1); g.fillStyle = fill; g.fillRect(a, b, c - a, d - b); };
  for (const o of OBSTACLES) rect(o, o.name === '雪糕筒' ? '#ff6a13' : o.name === '障碍车辆' ? '#6b7078' : '#8c8a85');
  for (const L of LINES) rect(L, L.kind === 'control' ? '#f5c518' : L.name === '库底线' ? '#e53935' : '#eeeeee');
  const path = (pts, color, w, dash) => {
    g.strokeStyle = color; g.lineWidth = w; g.setLineDash(dash || []); g.beginPath(); let k = null;
    pts.forEach((p, i) => { const [x, y] = P(p.x, p.z); if (i === 0 || p.k !== k) g.moveTo(x, y); else g.lineTo(x, y); k = p.k; }); g.stroke(); g.setLineDash([]);
  };
  path(PATH, '#3ddc84', 3, [10, 8]); path(S.history, '#ff5fa2', 3.5);
  const poly = carCorners(car); g.strokeStyle = '#5ad1ff'; g.lineWidth = 3; g.beginPath(); poly.forEach((p, i) => { const [x, y] = P(p.x, p.z); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.closePath(); g.stroke();
  g.font = '18px sans-serif';
  IDEAL.events.forEach((e, i) => {
    const [x, y] = P(e.pose.x, e.pose.z); g.strokeStyle = '#3ddc84'; g.lineWidth = 2; g.beginPath(); g.arc(x, y, 7, 0, 7); g.stroke();
    const a = S.metrics.evActual[i]; if (a) { const [ax, ay] = P(a.x, a.z); g.fillStyle = '#ffd54a'; g.beginPath(); g.arc(ax, ay, 5, 0, 7); g.fill(); g.fillText(String(i + 1), ax + 7, ay + 16); }
  });
  for (const m of Replay.computeMarks()) { const [x, y] = P(m.x, m.z); g.fillStyle = '#ff3b30'; g.beginPath(); g.arc(x, y, 7, 0, 7); g.fill(); g.fillStyle = '#fff'; g.fillText(fmt(m.dev, 2) + 'm', x + 9, y - 6); }
  g.fillStyle = '#fff'; g.font = '20px sans-serif'; const [sx, sy] = P(IDEAL.start.x, IDEAL.start.z); g.fillText('起点', sx - 18, sy - 14);
}

const Onboard = {
  i: 0,
  cards: [
    () => `<h2>欢迎来到停车入库教练</h2><p>包含<b>倒车入库（左/右）</b>、<b>侧方停车</b>等多个关卡，点顶部"场景"切换；还可以用"摆放障碍"自己放雪糕筒和车。</p><p>我们会解释<b>为什么</b>这样打方向：地面实时画出预测轨迹，半透明蓝车是标准路线。</p>`,
    () => `<h2>怎么开（自动挡）</h2><div class="keys">
      <span>W / ↑</span><span>前进（倒车中按 = 刹车）</span><span>S / ↓</span><span>后退（前进中按 = 刹车）</span>
      <span>A D / ← →</span><span>方向盘（D/→ 向右）· C 一键回正</span><span>X</span><span>刹车</span>
      <span>空格</span><span>手刹</span><span>触屏</span><span>左下拖动方向盘，右下 前进 / 后退 / 刹车 / 手刹</span></div>`,
    () => `<h2>点位辅助</h2><p>驾校教的"看点"会直接画出来（P 键开关）：</p><div class="keys">
      <span>镜中</span><span>青色 = 要找的库线/库角，黄色 = 车身上的参考点（后轮、车尾角），对齐变绿</span>
      <span>车内</span><span>发动机盖上的黄色小点（如"引擎盖中点"），从车内看库线压在点上 = 距离正确</span>
      <span>视角</span><span>1 跟随 · 2 俯视 · 3 车内 · 4 回头看；V 后视镜画中画</span></div>`,
    () => `<h2>选择模式</h2><p><b>引导模式</b>：分步讲解，每步达成后暂停，点"继续"进入下一步。</p><p><b>练习模式</b>：无引导，只在出错时提示，结束后评分并给出建议。</p>
      <div class="card-actions" style="justify-content:center"><button class="primary" id="obGuide">开始引导模式（推荐）</button><button id="obPractice">练习模式</button></div>`,
  ],
  open(i = 0) { this.i = i; $('onboard').classList.add('show'); S.paused = true; this.render(); },
  close() { if (!$('onboard').classList.contains('show')) return; $('onboard').classList.remove('show'); LS.set('rp_onboard_v2', true); S.paused = Teach.waiting || S.finished || S.editing; },
  next() { if (this.i < this.cards.length - 1) { this.i++; this.render(); } else this.close(); },
  render() {
    const last = this.i === this.cards.length - 1;
    $('onboardBox').innerHTML = this.cards[this.i]() + `<div class="card-actions" style="justify-content:space-between;margin-top:14px">
      <button id="obSkip">跳过</button>${last ? '' : `<button class="primary" id="obNext">下一步（${this.i + 1}/${this.cards.length}）</button>`}</div>
      <div class="dots">${this.cards.map((_, k) => `<i class="${k === this.i ? 'on' : ''}"></i>`).join('')}</div>`;
    $('obSkip').onclick = () => this.close();
    $('obNext') && ($('obNext').onclick = () => this.next());
    if (last) { $('obGuide').onclick = () => { this.close(); if (S.mode !== 'guide') Session.setMode('guide'); }; $('obPractice').onclick = () => { this.close(); Session.setMode('practice'); }; }
  },
};

/* =========================================================================================
   15. 车辆视觉同步
   ========================================================================================= */
function syncCarVisual(st, braking) {
  player.group.position.set(st.x, 0, st.z); player.group.rotation.y = -st.th;
  const [dl, dr] = ackermann(st.d);
  player.wheels.forEach((w, i) => { if (w.front) w.pivot.rotation.y = -(i === 0 ? dl : dr); w.spin.rotation.z = -car.spin; });
  player.swSpin.rotation.x = st.d * PHYS.STEER_RATIO;   // 方向盘 = δ × 转向比（向右 = 顺时针）
  const tail = player.tailMat;
  tail.emissive.setHex(braking ? COLORS.tailBrake : st.gear === 'R' ? COLORS.tailReverse : COLORS.tailDim);
  tail.emissiveIntensity = braking ? 2.2 : st.gear === 'R' ? 1.6 : 1;
  const cl = player.cluster, kmh = fmt(Math.abs(st.v) * 3.6, 1), key = kmh + st.gear + st.hb + Math.round(st.d / DEG);
  if (cl.last !== key) {
    cl.last = key; const g = cl.canvas.getContext('2d');
    g.fillStyle = '#04070b'; g.fillRect(0, 0, 256, 96);
    g.fillStyle = '#5ad1ff'; g.font = 'bold 46px sans-serif'; g.textBaseline = 'alphabetic'; g.fillText(kmh, 14, 56);
    g.font = '14px sans-serif'; g.fillStyle = '#8aa'; g.fillText('km/h', 18, 80); g.fillStyle = '#ccd'; g.fillText(`前轮 ${Math.round(st.d / DEG)}°`, 104, 80);
    g.font = 'bold 50px sans-serif'; g.fillStyle = st.gear === 'R' ? '#ff9f1c' : '#3ddc84'; g.fillText(st.gear, 196, 58);
    if (st.hb) { g.fillStyle = '#ff3b30'; g.font = 'bold 22px sans-serif'; g.fillText('(P)', 112, 40); }
    cl.tex.needsUpdate = true;
  }
}

/* =========================================================================================
   16. 主循环
   ========================================================================================= */
let last = performance.now(), avgMs = 16;
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); Mirrors.layout(); UI.renderStepCard(); });

/** 逻辑更新：物理 → 几何量 → 评分指标 → 记录 → 教学判定 */
function simStep(dt) {
  if (Replay.active) { Replay.update(dt); computeCtx(Replay.state); return; }
  if (S.paused) { computeCtx(car); return; }
  Physics.step(dt); computeCtx(car); Score.track(); Session.record(dt); Teach.update();
  if (S.mode === 'practice' && !S.finished && car.hb && ctx.inSlot && S.started) Session.finish();
}
function loop(now) {
  const rawMs = now - last; last = now;
  const dt = Math.min(0.05, rawMs / 1000);
  avgMs = lerp(avgMs, rawMs, 0.05); Mirrors.slow = avgMs > MIRROR.SLOW_FRAME_MS;
  if (input.keys.has('KeyQ')) CamSys.turnHead(1, dt);
  if (input.keys.has('KeyE')) CamSys.turnHead(-1, dt);
  simStep(dt);
  const st = vis();
  syncCarVisual(st, !Replay.active && !S.paused && (Physics.braking || car.hb));
  Pred.update(st, S.pred && !S.editing);
  MirrorAux.car.visible = MirrorAux.slot.visible = S.aux;
  CamSys.update(dt);
  UI.hud();
  renderer.shadowMap.needsUpdate = true;
  Mirrors.render();
  Teach.visuals(now / 1000);   // 镜中点位叠加需在镜子相机更新后绘制
  renderer.setRenderTarget(null); renderer.clear(); renderer.render(scene, camera);
  if (Mirrors.anyOverlay()) { renderer.clearDepth(); renderer.render(overlayScene, overlayCam); }
  requestAnimationFrame(loop);
}

Mirrors.init(); MirrorAux.init(); PointFX.init(); UI.init();
Session.loadLevel(LS.get('rp_level', LEVELS[0].id));
if (!LS.get('rp_onboard_v2', false)) Onboard.open(0);
requestAnimationFrame(loop);

// 调试入口（控制台可访问，不影响使用）
window.__app = { car, S, Teach, CamSys, Session, ctx, input, Replay, Physics, simStep, Mirrors, player, LEVELS, Editor, get STEPS() { return STEPS; }, get IDEAL() { return IDEAL; }, get SLOT() { return SLOT; }, OBSTACLES, LINES, collides };
</script>
